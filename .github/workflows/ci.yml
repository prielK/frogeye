name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: frogeye
          POSTGRES_PASSWORD: frogeye
          POSTGRES_DB: frogeye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frogeye -d frogeye_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # The event-bus tests publish to and subscribe from a real Redis (tests/core and
      # tests/api test_events), as the local test project's redis-test does.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://frogeye:frogeye@localhost:5432/frogeye_test
      TEST_DATABASE_URL: postgresql+psycopg://frogeye:frogeye@localhost:5432/frogeye_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-key-for-pytest-at-least-32-bytes-long
      HTTP_USER_AGENT: "Mozilla/5.0 (compatible; FrogEye/0.1)"
      SEC_USER_AGENT: "FrogEye Research ci@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check app tests evals
      # mypy is intentionally not run yet: `mypy app` reports pre-existing errors and has no
      # project config. Enable it here once the baseline is clean.
      - run: uv run pytest
      # The eval harness replays its committed recordings (no API key, no cost) against the
      # same Postgres service and fails unless it reproduces evals/results/latest.json.
      - name: Evals reproduce the committed results
        run: uv run python -m evals.run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: false
          load: true
          tags: frogeye-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # both tokenizer encodings are baked into the image and load offline as the
      # non-root runtime user (an encoding missing at runtime broke every embedding once).
      - name: Tokenizers load offline as uid 10001
        run: >-
          docker run --rm --network none --user 10001 --entrypoint python frogeye-backend:ci
          -c "import tiktoken; [tiktoken.get_encoding(n).encode('ok') for n in ('cl100k_base', 'o200k_base')]"
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
