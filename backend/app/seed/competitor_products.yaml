# Competitor products vs JFrog: each tier 1-2 competitor's main products that
# compete with a JFrog product, with a category, a public source URL and the JFrog counterparts
# (names from app.agents.analysis_schema.JFROG_PRODUCTS). Curated and conservative: only
# products the vendor's own public page describes, mapped to the JFrog product a buyer would
# weigh them against. No market-share, revenue or other figures here; those come only from
# verified, quoted facts. Never the self competitor. Each URL was checked live on
# 2026-10-20 (socket.dev blocks automated readers; it is the vendor's public home page).
# The seed owns the table: a product removed here is removed on the next seed run.
sonatype:
  - {name: Nexus Repository, category: Artifact repository, jfrog_products: [Artifactory, Container Registry],
     url: "https://www.sonatype.com/products/sonatype-nexus-repository"}
  - {name: Sonatype Firewall, category: Dependency firewall, jfrog_products: [Curation],
     url: "https://www.sonatype.com/products/sonatype-repository-firewall"}
  - {name: Sonatype Lifecycle, category: Software composition analysis, jfrog_products: [Xray],
     url: "https://www.sonatype.com/products/open-source-security-dependency-management"}
  - {name: Sonatype SBOM Manager, category: SBOM management, jfrog_products: [Xray],
     url: "https://www.sonatype.com/products/sbom-manager"}
github:
  - {name: GitHub Packages, category: Artifact repository, jfrog_products: [Artifactory, Container Registry],
     url: "https://docs.github.com/en/packages"}
  - {name: GitHub Advanced Security, category: Application security, jfrog_products: [Xray, Advanced Security],
     url: "https://github.com/security/advanced-security"}
  - {name: GitHub MCP Registry, category: MCP registry, jfrog_products: [MCP Registry],
     url: "https://github.com/mcp"}
gitlab:
  - {name: GitLab package registry, category: Artifact repository, jfrog_products: [Artifactory],
     url: "https://docs.gitlab.com/user/packages/package_registry/"}
  - {name: GitLab container registry, category: Container registry, jfrog_products: [Container Registry],
     url: "https://docs.gitlab.com/user/packages/container_registry/"}
  - {name: GitLab dependency scanning, category: Software composition analysis, jfrog_products: [Xray],
     url: "https://docs.gitlab.com/user/application_security/dependency_scanning/"}
cloudsmith:
  - {name: Cloudsmith artifact management, category: Artifact repository,
     jfrog_products: [Artifactory, Container Registry, Distribution], url: "https://cloudsmith.com/product"}
  # named as its page names it ("Software supply chain security with Cloudsmith")
  - {name: Cloudsmith software supply chain security, category: Supply chain security,
     jfrog_products: [Curation], url: "https://cloudsmith.com/product/dependency-firewall"}
snyk:
  - {name: Snyk Open Source, category: Software composition analysis, jfrog_products: [Xray],
     url: "https://snyk.io/product/open-source-security-management/"}
  - {name: Snyk Container, category: Container security, jfrog_products: [Xray],
     url: "https://snyk.io/product/container-vulnerability-management/"}
  - {name: Snyk Code, category: Static analysis (SAST), jfrog_products: [Advanced Security],
     url: "https://snyk.io/product/snyk-code/"}
harness:
