[project]
name = "frogeye-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "psycopg[binary]",
  "alembic",
  "pgvector",
  "httpx",
  "feedparser",
  "trafilatura",
  "protego",
  "tenacity",
  "langdetect",
  "pyjwt",
  "bcrypt",
  "pyyaml",
  "celery[redis]",
  "redis",
  "openai>=3.35.0",
  "langchain-core>=1.6.12",
  "langchain-openai>=1.7.2",
  "langgraph>=1.2.16",
  "langgraph-checkpoint-postgres>=3.2.0",
  "psycopg-pool>=3.3.3",
  "tiktoken>=0.14.0",
  "rapidfuzz>=3.14.6",
  "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx",
  "ruff",
  "mypy",
  "types-PyYAML",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "live_llm: calls the real OpenAI API; needs RUN_LIVE_LLM=1 and OPENAI_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
