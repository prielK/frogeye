name: frogeye-test

services:
  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: frogeye
      POSTGRES_PASSWORD: frogeye
      POSTGRES_DB: frogeye_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frogeye -d frogeye_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-test:
    build:
      context: ./backend
      target: dev
    working_dir: /app
    volumes:
      - ./backend:/app
      # read-only, for the DESIGN.md front-matter test
      - ./DESIGN.md:/DESIGN.md:ro
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://frogeye:frogeye@db-test:5432/frogeye_test
      TEST_DATABASE_URL: postgresql+psycopg://frogeye:frogeye@db-test:5432/frogeye_test
      REDIS_URL: redis://redis-test:6379/0
      JWT_SECRET: test-secret-key-for-pytest-at-least-32-bytes-long
      HTTP_USER_AGENT: "Mozilla/5.0 (compatible; FrogEye/0.1)"
      SEC_USER_AGENT: "FrogEye Research you@example.com"

  # The eval harness (backend/evals): `make eval` replays the committed recordings (no key,
  # no cost); `make eval-record` makes the live calls they lack, so it loads .env for
  # OPENAI_API_KEY and the model settings. `environment:` still points it at the test
  # services, never at the main stack's database.
  eval:
    build:
      context: ./backend
      target: dev
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://frogeye:frogeye@db-test:5432/frogeye_test
      TEST_DATABASE_URL: postgresql+psycopg://frogeye:frogeye@db-test:5432/frogeye_test
      REDIS_URL: redis://redis-test:6379/0
      JWT_SECRET: test-secret-key-for-pytest-at-least-32-bytes-long
      HTTP_USER_AGENT: "Mozilla/5.0 (compatible; FrogEye/0.1)"
    command: ["python", "-m", "evals.run"]

  web-test:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web-test-node-modules:/app/node_modules
    # `run --rm web-test <cmd>`: install from the lockfile, then run <cmd>.
    entrypoint: ["sh", "-c", "npm ci && $$0 \"$$@\""]
    command: ["npx", "vitest", "run"]
    environment:
      CI: "true"

  # Smoke e2e against the running stack: `docker compose up -d --build` first, then
  # `docker compose -f docker-compose.test.yml run --rm web-e2e`.
  # Image tag must match the pinned @playwright/test version in frontend/package.json.
  web-e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web-e2e-node-modules:/app/node_modules
    entrypoint: ["sh", "-c", "npm ci && $$0 \"$$@\""]
    command: ["npx", "playwright", "test", "--project=chromium"]
    environment:
      CI: "true"
      BASE_URL: ${E2E_BASE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  web-test-node-modules:
  web-e2e-node-modules:
